schema_version: dokimi_config.v1
defaults:
  skills: skills/*
  suite:
    beside: '{skill}/evals/**'
    harbor: evaluation/harbor/tasks/**
shared:
  - skills.yaml
  - evaluation/harbor/suites.json
  - evaluation/harbor/instructions/**
  - tools/**
  - .github/dokimi/**
  - .github/workflows/dokimi*.yml
baseline:
  store: 'branch:dokimi-baselines'
