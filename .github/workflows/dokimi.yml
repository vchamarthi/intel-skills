name: Dokimi catalog evaluation
run-name: ${{ github.event_name == 'workflow_dispatch' && format('dokimi:model pr={0} head={1} base={2}', inputs.pr-number, inputs.expected-head, inputs.expected-base) || 'dokimi:check' }}

on:
  pull_request:
    paths:
      - skills/**
      - skills.yaml
      - evaluation/harbor/**
      - tools/**
      - .github/dokimi/**
      - .github/workflows/dokimi*.yml
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number for this exact approved candidate
        type: number
        required: true
      expected-head:
        description: Full pull request head commit SHA
        type: string
        required: true
      expected-base:
        description: Full pull request base commit SHA
        type: string
        required: true
      subject:
        description: One locally evaluated subject, using its catalog ID
        type: string
        required: true
      provider:
        description: Answer provider supported by the pinned engine
        type: string
        required: true
      judge-provider:
        description: Independent judge provider
        type: string
        required: true
      max-usd:
        description: Monetary budget for API providers; unused for subscriptions
        type: string
        required: false
      model:
        description: Answer model ID
        type: string
        required: true
      judge-model:
        description: Independent judge model ID
        type: string
        required: true
      max-calls:
        description: Maximum subscription model calls, including judge calls
        type: number
        required: false
      reps:
        description: Repetitions per task and arm
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: dokimi-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr-number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: vchamarthi/dokimi/.github/workflows/dokimi-pr.yml@3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
    with:
      dokimi-repository: vchamarthi/dokimi
      dokimi-ref: 3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
      mode: check
      subject-kind: catalog
      config: .github/dokimi/config.yaml

  model:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: vchamarthi/dokimi/.github/workflows/dokimi-pr.yml@3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
    with:
      dokimi-repository: vchamarthi/dokimi
      dokimi-ref: 3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
      mode: run
      subject-kind: catalog
      config: .github/dokimi/config.yaml
      subject: ${{ inputs.subject }}
      model: ${{ inputs.model }}
      provider: ${{ inputs.provider }}
      judge-model: ${{ inputs.judge-model }}
      judge-provider: ${{ inputs.judge-provider }}
      max-calls: ${{ fromJSON(inputs.max-calls || '0') }}
      reps: ${{ fromJSON(inputs.reps) }}
      harness: arms-runner
      environment: ${{ vars.DOKIMI_ENVIRONMENT }}
      policy: ${{ vars.DOKIMI_POLICY }}
      max-usd: ${{ inputs.max-usd }}
      pr-number: ${{ fromJSON(inputs.pr-number) }}
      expected-head: ${{ inputs.expected-head }}
      expected-base: ${{ inputs.expected-base }}
    secrets:
      openai-api-key: ${{ (inputs.provider == 'openai' || inputs.judge-provider == 'openai') && secrets.OPENAI_API_KEY || '' }}
      anthropic-api-key: ${{ (inputs.provider == 'anthropic' || inputs.judge-provider == 'anthropic') && secrets.ANTHROPIC_API_KEY || '' }}
      DOKIMI_CLAUDE_CODE_OAUTH_TOKEN: ${{ (inputs.provider == 'claude-cli' || inputs.judge-provider == 'claude-cli') && secrets.DOKIMI_CLAUDE_CODE_OAUTH_TOKEN || '' }}
