name: Record approved Dokimi baseline

on:
  workflow_dispatch:
    inputs:
      source-run:
        description: Exact qualified model evaluation run ID
        type: string
        required: true
      source-attempt:
        description: Exact qualified source run attempt
        type: string
        required: true
      controller-sha:
        description: Full approved default-branch controller SHA that produced the source run
        type: string
        required: true
      expect-previous:
        description: Current baseline record digest, or none for the first record
        type: string
        required: true
        default: none

permissions: {}

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: vchamarthi/dokimi/.github/workflows/dokimi-record.yml@3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
    with:
      dokimi-repository: vchamarthi/dokimi
      dokimi-ref: 3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
      source-run: ${{ inputs.source-run }}
      source-attempt: ${{ inputs.source-attempt }}
      source-workflow: .github/workflows/dokimi.yml
      controller-sha: ${{ inputs.controller-sha }}
      policy-digest: ${{ vars.DOKIMI_POLICY_DIGEST }}
      expect-previous: ${{ inputs.expect-previous }}
      policy: ${{ vars.DOKIMI_POLICY }}
      commit-author: ${{ github.actor }}
      commit-email: ${{ format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}
