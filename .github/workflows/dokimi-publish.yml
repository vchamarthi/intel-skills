name: Publish Dokimi evaluation receipt

# The pinned publisher verifies run/artifact/current PR identities and bounded JSON.
# It never checks out or executes candidate code; only this trigger is exempted.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Dokimi catalog evaluation]
    types: [completed]

permissions: {}

jobs:
  publish:
    permissions:
      actions: read
      pull-requests: write
    uses: vchamarthi/dokimi/.github/workflows/dokimi-publish.yml@3b63dcd14c13dd34422d8bfabbc34d4c6e3ba499
    with:
      source-run: ${{ format('{0}', github.event.workflow_run.id) }}
      source-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt) }}
      source-workflow: .github/workflows/dokimi.yml
      controller-sha: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.sha || '' }}
      policy-digest: sha256:c678210e50945577cb4fbe56d8e45f98afaee736f69a652907329495bc42f7ca
